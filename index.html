<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Lab</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/part-a.js" defer></script>
</head>
<body>
    <header>
        <h1 id="title">Lagoon Café</h1>
        <p class="tagline">Fresh food by the Batticaloa lagoon</p>
    </header>
    <nav>
        <a href="#menu" class="nav-link">Menu</a>
        <a href="#hours" class="nav-link">Hours</a>
        <a href="#contact" class="nav-link">Contact</a>
    </nav>
    <main>
        <h2 id="menu">Today's menu</h2>
        <ul id="menu-list">
            <li class="item">Rice and curry</li>
            <li class="item special">Crab curry</li>
            <li class="item">Kottu</li>
        </ul>
        <p id="message">Click a button to see what happens.</p>
        <button id="greet-btn" type="button">Say hello</button>
        <button id="theme-btn" type="button">Dark mode</button>
        <h2 id="hours">Opening hours</h2>
        <p class="hours">Monday to Saturday, 8 am to 9 pm</p>
        <h2>Try it</h2>
        <input id="name-input" type="text" placeholder="Your name">
        <p id="preview"></p>
        <p id="counter">0 / 20</p>
    </main>
    <footer id="contact">
        <p>Lagoon Café · Batticaloa</p>
    </footer>
</body>
</html>
